<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小智 · 智能问答机器人</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #6366f1;
    --accent2: #8b5cf6;
    --bg1: #eef2ff;
    --bg2: #fdf4ff;
    --bg3: #ecfeff;
    --text: #1f2937;
    --text-light: #9ca3af;
  }

  html, body { height: 100%; }

    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
  }

  .app {
    width: 100%;
    max-width: 860px;
    height: calc(100vh - 36px);
    max-height: 900px;
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 24px 60px -18px rgba(99, 102, 241, .25), 0 4px 14px rgba(0,0,0,.06);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid #f1f5f9;
    background: rgba(255,255,255,.9);
    flex-shrink: 0;
  }
  .logo {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 10px rgba(99,102,241,.35);
  }
  .title-box { flex: 1; min-width: 0; }
  .title-box h1 { font-size: 17px; font-weight: 700; }
  .title-box p { font-size: 12px; color: var(--text-light); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.18); }
  .head-btn {
    border: 1px solid #e5e7eb;
    background: #fff;
    color: #4b5563;
    font-size: 13px;
    padding: 7px 13px;
    border-radius: 10px;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .head-btn:hover { border-color: var(--accent); color: var(--accent); background: #eef2ff; }

    flex: 1;
    overflow-y: auto;
    padding: 22px 20px 10px;
    background: #f8f9fe;
    scroll-behavior: smooth;
  }
  #chat::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-thumb { background: #d7dbef; border-radius: 3px; }

  .msg {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    animation: pop .3s ease;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;

  .bubble-wrap { max-width: 74%; display: flex; flex-direction: column; }
  .msg.user .bubble-wrap { align-items: flex-end; }

  .bubble {
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;

  .typing span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #b4b9e8;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .5; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* ---------- 推荐问题 ---------- */
  .chips {
    display: flex;
    gap: 8px;
    padding: 10px 20px 4px;
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    border: 1px solid #e5e7eb;
    background: #fff;
    color: #4f46e5;
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: all .2s;
  }
  .chip:hover { background: var(--accent); border-color: var(--accent); color: #fff; transform: translateY(-1px); }

  /* ---------- 输入区 ---------- */
  footer {
    display: flex;
    gap: 10px;
    padding: 14px 20px 18px;
    border-top: 1px solid #f1f5f9;
    background: #fff;
    flex-shrink: 0;

  #input {
    flex: 1;
    border: 1.5px solid #e5e7eb;
    border-radius: 12px;
    padding: 11px 15px;
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    transition: border-color .2s, box-shadow .2s;

  #send {
    width: 46px; height: 46px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, box-shadow .2s;
    flex-shrink: 0;
  }
  #send:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(99,102,241,.4); }
  #send:active { transform: scale(.94); }
  #send svg { width: 20px; height: 20px; }

  @media (max-width: 600px) {
    body { padding: 0; }
    .app { height: 100vh; max-height: none; border-radius: 0; }
    .bubble-wrap { max-width: 82%; }
  }
</style>
</head>

function normalize(s) {
  return s.toLowerCase().replace(/[\s，。？！?!,.'"'""~～、:：;；-]/g, "");

  };
  const power = () => {
    const base = factor();
    if (s[i] === "^") { i++; return Math.pow(base, power()); }
    return base;
  };
  const term = () => {
    let v = power();
    while (s[i] === "*" || s[i] === "/" || s[i] === "%") {
      const op = s[i++], r = power();
      if (op === "*") v *= r;
      else if (op === "/") { if (r === 0) throw "除零"; v /= r; }
      else v %= r;
    }
    return v;
  };
  const expr = () => {
    let v = term();
    while (s[i] === "+" || s[i] === "-") {
      const op = s[i++], r = term();
      v = op === "+" ? v + r : v - r;
    }
    return v;
  };
  const v = expr();
  if (i !== s.length) throw "格式";
  return v;
}

/* 把中文算式转成符号，尝试计算；成功返回 {expr, value}，否则 null */
function tryMath(text) {
  let t = text
    .replace(/帮我算|计算一下|计算|算一下|等于多少|等于几|是多少|多少|等于|[?？=]/g, "")
    .replace(/加上|加/g, "+").replace(/减去|减/g, "-")
    .replace(/乘以|乘|×|x|X|\*/g, "*")
    .replace(/除以|除|÷/g, "/")
    .replace(/的平方/g, "^2");
  if (!/\d/.test(t) || !/[+\-*/%^]/.test(t)) return null;
  // 剩余内容必须只含数字与运算符，避免把普通句子误判为算式
  if (!/^[0-9+\-*/%^().]+$/.test(t)) return null;
  try {
    const v = calc(t);
    const pretty = +v.toFixed(10);
    const shown = t.replace(/\*/g, " × ").replace(/\//g, " ÷ ").replace(/\+/g, " + ").replace(/(?<=[0-9)])-/g, " - ");
    return { expr: shown.trim(), value: pretty };
  } catch (e) {
    if (e === "除零") return { expr: t, value: null };
    return null;
  }
}

/* ---------- 动态问答（时间 / 数学 / 记名字 等） ---------- */
function dynamicAnswer(text) {
  const n = normalize(text);

  // 记住名字：我叫XX
  const nameSet = text.match(/(?:我叫|我的名字叫|我的名字是)\s*([^\s，。？?!！]{1,10})/);
  if (nameSet && !/什么|谁/.test(nameSet[1])) {
    userName = nameSet[1];
    return rand([`记住啦，${userName}！很高兴认识你 😊`, `你好呀 ${userName}！这个名字真好听～`, `收到！以后我就叫你 ${userName} 啦。`]);
  }
  // 询问名字
  if (/我叫什么|我的名字|我是谁|记得我吗|知道我是谁/.test(n)) {
    if (userName) return rand([`你叫 ${userName} 呀，我记性还不错吧 😎`, `当然记得！你是 ${userName}～`]);
    return "你还没告诉我你的名字呢～可以说“我叫某某某”，我就记住啦！";
  }

  // 时间与日期
  if (/几点|现在时间|时间/.test(n)) {
    const d = new Date(), p = x => String(x).padStart(2, "0");
    return `现在是 ${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日 星期${"日一二三四五六"[d.getDay()]}，${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())} ⏰`;
  }
  if (/几号|日期|星期几|今天.*号/.test(n)) {
    const d = new Date();
    return `今天是 ${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日，星期${"日一二三四五六"[d.getDay()]} 📅`;
  }

  // 数学计算
  const m = tryMath(text);
  if (m) {
    if (m.value === null) return `${m.expr} 里出现了除以 0，这个可算不出来哦 🙈`;
    return `${m.expr} = ${m.value} ✅`;
  }

  return null; // 没命中动态规则，交给知识库
}

/* ---------- 知识库匹配 ---------- */
function kbAnswer(text) {
  const n = normalize(text);
  let best = null, bestScore = 0;
  for (const item of KNOWLEDGE) {
    let score = 0;
    for (const kw of item.keywords) {
      const k = normalize(kw);
      if (n.includes(k)) score += k.length * 2;
      if (n === k) score += 6; // 完全一致加权
    }
    if (score > bestScore) { bestScore = score; best = item; }
  }
  return bestScore >= 3 && best ? rand(best.answers) : null;
}

function fallbackAnswer() {
  return rand([
    "这个问题有点超出我的知识范围啦 🤔 我擅长：报时间、算数学、科普小知识、讲笑话、猜脑筋急转弯…换个方向问问看？",
    "嗯…这条我还在学习中 📚 你可以问我时间日期、数学计算，或者让我讲个笑话放松一下～",
    "暂时答不上来呢 😅 试试下面的推荐问题，或者输入“帮助”看看我都会什么！"
  ]);
}

function helpText() {
  return "我会这些本领：\n" +
    "🕐 报时间日期 —— 问问“现在几点了”\n" +
    "🧮 数学计算 —— 试试“1 + 2 × 3 等于多少”\n" +
    "🔭 科普问答 —— 比如“天为什么是蓝的”\n" +
    "😄 讲笑话 / 出脑筋急转弯\n" +
    "📝 记住你的名字 —— 说“我叫某某某”\n" +
    "知识库共有 " + KNOWLEDGE.length + " 个主题，欢迎多多提问！";
}

/* ============================================================
 * 界面交互
 * ============================================================ */
const DEFAULT_CHIPS = ["现在几点了？", "1+2*3等于多少", "天为什么是蓝的？", "讲个笑话", "你能做什么"];

function addMsg(role, text, typing = false) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "bot" ? "🤖" : "🙂";
  const bw = document.createElement("div");
  bw.className = "bubble-wrap";
  const bubble = document.createElement("div");
  bubble.className = "bubble" + (typing ? " typing" : "");
  if (typing) bubble.innerHTML = "<span></span><span></span><span></span>";
  else bubble.textContent = text;
  const time = document.createElement("div");
  time.className = "time";
  time.textContent = nowTime();
  bw.appendChild(bubble); bw.appendChild(time);
  wrap.appendChild(avatar); wrap.appendChild(bw);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return bubble;
}

/* 机器人回答：先显示“正在输入”，再打字机效果逐字输出 */
let typingTimer = null;
function botSay(text) {
  history.push({ role: "bot", text, time: nowTime() });
  const indicator = addMsg("bot", "", true);
  const delay = Math.min(500 + text.length * 6, 1400);
  typingTimer = setTimeout(() => {
    indicator.className = "bubble";
    let i = 0;
    const step = () => {
      i = Math.min(i + 2, text.length);
      indicator.textContent = text.slice(0, i);
      chatEl.scrollTop = chatEl.scrollHeight;
      if (i < text.length) typingTimer = setTimeout(step, 18);
    };
    step();
  }, delay);
}

function showChips(list) {
  const box = $("chips");
  box.innerHTML = "";
  list.forEach(q => {
    const c = document.createElement("button");
    c.className = "chip";
    c.textContent = q;
    c.onclick = () => { send(q); };
    box.appendChild(c);
  });
}

function send(raw) {
  const text = (raw !== undefined ? raw : inputEl.value).trim();
  if (!text) return;
  if (raw === undefined) inputEl.value = "";
  clearTimeout(typingTimer);
  // 移除可能残留的“正在输入”指示
  chatEl.querySelectorAll(".typing").forEach(t => t.closest(".msg").remove());

  addMsg("user", text);
  history.push({ role: "user", text, time: nowTime() });

  let answer;
  if (/^帮助|help|你能做什么|你会什么|有什么功能|怎么用/i.test(text)) answer = helpText();
  else answer = dynamicAnswer(text) || kbAnswer(text) || fallbackAnswer();

  botSay(answer);
  if (/知识范围|学习中|答不上来/.test(answer)) showChips(DEFAULT_CHIPS);
}

/* 清空与导出 */
$("clearBtn").onclick = () => {
  if (!confirm("确定要清空当前对话吗？")) return;
  clearTimeout(typingTimer);
  chatEl.innerHTML = "";
  history = [];
  welcome();
};
$("exportBtn").onclick = () => {
  if (!history.length) { alert("还没有对话记录哦～"); return; }
  const lines = history.map(m => `[${m.time}] ${m.role === "bot" ? "小智" : "我"}：${m.text}`);
  const blob = new Blob(["小智 · 智能问答机器人 对话记录\n\n" + lines.join("\n")], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "智能问答记录.txt";
  a.click();
  URL.revokeObjectURL(a.href);
};

/* 回车发送 */
inputEl.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
$("send").onclick = () => send();

/* 欢迎语 */
function welcome() {
  botSay("你好，我是智能问答机器人小智 🤖\n所有回答都在你的浏览器本地生成，无需联网。\n可以点下方的问题开始，也可以直接输入提问～");
  showChips(DEFAULT_CHIPS);
}
welcome();
</script>
